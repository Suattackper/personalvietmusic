<!DOCTYPE html>
<html lang="vi" data-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnhTanMusic</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2" />
    <link rel="icon" type="image/png" href="favicon.png?v=2" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0f1115" />
    <link rel="apple-touch-icon" href="icon-192.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AnhTanMusic" />
    <script>
        window.vietmusicLanguage = {
            apply: function (code) {
                var english = code === "en";
                document.documentElement.lang = english ? "en" : "vi";
                var error = document.getElementById("blazor-error-ui");
                if (error) {
                    error.querySelector(".error-message").textContent = english ? "An unexpected error occurred." : "Đã xảy ra lỗi không mong muốn.";
                    error.querySelector(".reload").textContent = english ? "Reload page" : "Tải lại trang";
                    error.querySelector(".dismiss").title = english ? "Close" : "Đóng";
                }
            }
        };
        try { window.vietmusicLanguage.apply(localStorage.getItem("vietmusic_language")); } catch (e) { }
        // Áp theme đã lưu trước khi app khởi động để tránh chớp màu.
        (function () {
            try {
                var theme = localStorage.getItem("vietmusic_theme");
                document.documentElement.setAttribute("data-theme", theme === "light" ? "light" : "dark");
            } catch (e) { }
        })();
    </script>
</head>

<body>
    <div id="app">
        <div class="app-boot-loading">
            <svg class="loading-progress">
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>
            <div class="loading-progress-text"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        <span class="error-message">Đã xảy ra lỗi không mong muốn.</span>
        <a href="" class="reload">Tải lại trang</a>
        <a class="dismiss" title="Đóng">🗙</a>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/youtubePlayer.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
