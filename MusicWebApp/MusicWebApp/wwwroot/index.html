<!DOCTYPE html>
<html lang="vi" data-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VietMusic - Nghe nhạc Việt</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script>
        // Áp theme đã lưu trước khi app khởi động để tránh chớp màu.
        (function () {
            try {
                var theme = localStorage.getItem("vietmusic_theme");
                document.documentElement.setAttribute("data-theme", theme === "light" ? "light" : "dark");
            } catch (e) { }
        })();
    </script>
</head>

<body>
    <div id="app">
        <div class="app-boot-loading">
            <svg class="loading-progress">
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>
            <div class="loading-progress-text"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Đã xảy ra lỗi không mong muốn.
        <a href="" class="reload">Tải lại trang</a>
        <a class="dismiss" title="Đóng">🗙</a>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/youtubePlayer.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
